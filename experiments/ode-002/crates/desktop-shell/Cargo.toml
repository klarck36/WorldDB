[package]
name = "worlddb-ode-desktop-shell"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
build = "build.rs"

[features]
default = ["in-process"]
in-process = []
sidecar = []
native-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
blake3 = { version = "=1.8.7", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
getrandom = "=0.3.4"
tauri = { version = "=2.11.5" }
tauri-plugin-dialog = { version = "=2.7.1", default-features = false }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
worlddb-core = { path = "../../../../crates/worlddb-core" }
worlddb-cli = { path = "../../../../crates/worlddb-cli" }
worlddb-process-adapter = { path = "../../../../crates/worlddb-process-adapter" }
worlddb-ode-engine = { path = "../ode-engine" }
worlddb-storage-file = { path = "../../../../crates/worlddb-storage-file" }
