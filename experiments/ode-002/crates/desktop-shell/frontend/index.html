<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorldDB</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 36px 28px;
      }
      h1 { margin: 0 0 8px; font-size: 1.8rem; }
      p { line-height: 1.5; }
      .muted { opacity: 0.72; }
      .card {
        margin-top: 22px;
        padding: 20px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 12px;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      label { display: block; font-weight: 600; margin-bottom: 7px; }
      input, button {
        min-height: 40px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 8px;
        font: inherit;
      }
      input { box-sizing: border-box; width: 100%; padding: 8px 10px; background: Canvas; color: CanvasText; }
      button { padding: 8px 14px; cursor: pointer; background: ButtonFace; color: ButtonText; }
      button:disabled { cursor: wait; opacity: 0.6; }
      #project-status { font-size: 1.05rem; font-weight: 600; }
      #project-details { margin-bottom: 0; }
      #operation-status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <h1>WorldDB</h1>
      <p id="window-role" class="muted" role="status">Lokale Sitzung wird gestartet.</p>
      <section class="card" aria-labelledby="project-heading">
        <h2 id="project-heading">Projekt</h2>
        <p id="project-status" role="status">Projektstatus wird geprüft.</p>
        <p id="project-details" class="muted"></p>
        <div class="actions">
          <div style="flex: 1 1 240px">
            <label for="project-name">Neuer Projektname</label>
            <input id="project-name" maxlength="80" value="Mein WorldDB-Projekt" autocomplete="off" />
          </div>
        </div>
        <div class="actions">
          <button id="create-project" type="button" disabled>Neues Projekt</button>
          <button id="open-project" type="button" disabled>Projekt öffnen</button>
          <button id="close-project" type="button" disabled>Projekt schließen</button>
        </div>
        <p id="operation-status" class="muted" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
