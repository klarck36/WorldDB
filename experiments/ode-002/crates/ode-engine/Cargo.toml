[package]
name = "worlddb-ode-engine"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
build = "build.rs"

[lib]
name = "worlddb_ode_engine"

[[bin]]
name = "worlddb_ode_engine"
path = "src/main.rs"

[dependencies]
blake3 = "=1.8.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
worlddb-core = { path = "../../../../crates/worlddb-core" }
worlddb-storage-file = { path = "../../../../crates/worlddb-storage-file" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
