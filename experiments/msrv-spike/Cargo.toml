[package]
name = "worlddb-msrv-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]
resolver = "3"

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "help", "std", "usage"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = { version = "1.26.1", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
