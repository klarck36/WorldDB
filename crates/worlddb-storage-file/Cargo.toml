[package]
name = "worlddb-storage-file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
blake3.workspace = true
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
getrandom.workspace = true
worlddb-core = { path = "../worlddb-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.190"
