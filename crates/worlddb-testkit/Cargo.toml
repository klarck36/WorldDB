[package]
name = "worlddb-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
fault-injection = []
sqlite-reference = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled"], optional = true }
worlddb-core = { path = "../worlddb-core" }

[[test]]
name = "sqlite_reference_backend_contract"
required-features = ["sqlite-reference"]

[[bin]]
name = "fault-probe"
path = "src/bin/fault_probe.rs"
required-features = ["fault-injection"]

[[bin]]
name = "m6-14a-corpus"
path = "src/bin/m6_14a_corpus.rs"
