[workspace]
members = [
    "crates/worlddb-core",
    "crates/worlddb-storage-file",
    "crates/worlddb-cli",
    "crates/worlddb-testkit",
    "xtask",
]
resolver = "3"

[workspace.dependencies]
blake3 = { version = "=1.8.7", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
uuid = { version = "=1.26.1", default-features = false, features = ["std", "v7"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
