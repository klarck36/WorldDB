[workspace]
members = [
    "crates/worlddb-core",
    "crates/worlddb-storage-file",
    "crates/worlddb-cli",
    "crates/worlddb-testkit",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
