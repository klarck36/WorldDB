# WorldDB dependency policy, checked by cargo-deny 0.20.2.
[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
maximum-db-staleness = "P90D"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
workspace-default-features = "allow"
external-default-features = "deny"
deny = [
    { name = "anyhow", reason = "WorldDB errors remain typed; core error erasure is forbidden." },
    { name = "thiserror", reason = "WorldDB errors remain hand-authored typed contracts, not derived opaque errors." },
    { name = "failure", reason = "WorldDB errors remain typed; legacy universal error erasure is forbidden." },
]

# cc enables shlex's default/std feature as its locked build dependency. Keep
# the workspace-wide default-feature ban and allow only this exact package's
# reviewed feature set.
[[bans.features]]
crate = "shlex:2.0.1"
allow = ["default", "std"]

# rusqlite uses the iterator's alloc-only default for fallible row decoding.
# Permit only that exact version and feature set; the workspace-wide default
# feature ban remains enabled for every other dependency.
[[bans.features]]
crate = "fallible-iterator:0.3.0"
allow = ["default", "alloc"]

# The optional SQLite reference adapter builds the pinned upstream amalgamation.
# rusqlite enables this exact libsqlite3-sys feature set; broader SQLite,
# SQLCipher, bindgen, and extension features remain denied.
[[bans.features]]
crate = "libsqlite3-sys:0.35.0"
allow = [
    "default",
    "min_sqlite_version_3_14_0",
    "pkg-config",
    "vcpkg",
    "bundled",
    "cc",
    "bundled_bindings",
]

# fs4 1.1.0 enables rustix's default std/alloc support and windows-sys's
# empty default feature for its target adapters. The Windows storage adapter
# also selects the exact Foundation and FileSystem APIs it calls. Keep the
# exception exact-versioned; fs4 itself has defaults disabled.
[[bans.features]]
crate = "rustix:1.1.5"
allow = ["default", "std", "alloc", "fs"]

[[bans.features]]
crate = "windows-sys:0.61.2"
allow = [
    "default",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Storage",
    "Win32_System_IO",
    "Win32_System",
    "Win32",
    "Win32_Networking_WinSock",
    "Win32_Networking",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics",
]

[bans.build]
executables = "deny"
interpreted = "deny"
enable-builtin-globs = true
include-dependencies = true
include-workspace = true

# libc ships this developer utility, which WorldDB never runs during a build.
# Keep the interpreter scan enabled and exempt only this exact source path.
[[bans.build.bypass]]
crate = "libc"
allow-globs = ["etc/libc-util.py"]

# BLAKE3 includes these maintainer/release scripts in its published crate;
# none is invoked by its build script. Keep the scan enabled and exempt only
# the exact paths present in the locked 1.8.7 release.
[[bans.build.bypass]]
crate = "blake3:1.8.7"
allow-globs = [
    ".github/workflows/build_b3sum.py",
    ".github/workflows/upload_github_release_asset.py",
    "c/test.py",
]

# These are upstream SQLite/vcpkg maintenance and test scripts shipped in the
# locked source archives. The bundled Windows build compiles sqlite3.c and
# does not invoke them; keep the interpreted-file scan enabled elsewhere.
[[bans.build.bypass]]
crate = "libsqlite3-sys:0.35.0"
allow-globs = ["upgrade.sh", "upgrade_sqlcipher.sh"]

[[bans.build.bypass]]
crate = "vcpkg:0.2.15"
allow-globs = ["setup_vcp.sh", "tests/run.sh", "tests/vcpkgrs_target.sh"]

[licenses]
allow = ["MIT", "Apache-2.0", "Zlib"]
include-dev = true
include-build = true
confidence-threshold = 0.95
unused-allowed-license = "warn"

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
