name: M8-26b Native macOS E2E

on:
  pull_request:
    branches:
      - codex/worlddb-project-integration
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "experiments/ode-002/**"
      - "crates/**"
      - "tools/check_native_e2e_suite.py"
      - "tools/test_native_e2e_suite.py"
      - "docs/schemas/native-e2e-evidence.schema.json"
      - ".github/workflows/m8-26b-native-macos-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos-e2e:
    name: Native macOS APFS end-to-end
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out clean commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt

      - name: Check shared native suite catalog
        run: |
          python3 -B -X utf8 tools/check_native_e2e_suite.py
          python3 -B -X utf8 tools/test_native_e2e_suite.py

      - name: Install WebDriver client
        run: npm ci --prefix experiments/ode-002/e2e/native-e2e

      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path experiments/ode-002/Cargo.toml

      - name: Verify PowerShell runtime
        run: pwsh --version

      - name: Run macOS APFS native suite
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/worlddb/m8-26b-target
          WORLDDB_M8_26B_EVIDENCE_ROOT: ${{ runner.temp }}/worlddb/m8-26b-evidence
        run: node experiments/ode-002/scripts/run-native-e2e-macos.mjs --evidence-root "$WORLDDB_M8_26B_EVIDENCE_ROOT"

      - name: Archive native E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m8-26b-native-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worlddb/m8-26b-evidence/m8-26b-*/
          if-no-files-found: warn
          retention-days: 30
