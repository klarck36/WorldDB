name: M4-15 macOS APFS sync evidence

on:
  pull_request:
    branches:
      - codex/worlddb-project-integration
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/worlddb-storage-file/**"
      - "tools/m4-15/**"
      - "docs/M4-15-*.md"
      - ".github/workflows/m4-15-apfs-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apfs-sync:
    name: APFS sync measurements and storage fault tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out clean commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Verify APFS and record host metadata
        env:
          WORLDDB_M4_15_ROOT: ${{ runner.temp }}/worlddb/m4-15-evidence
        run: |
          set -euo pipefail
          mkdir -p "$WORLDDB_M4_15_ROOT"
          device=$(df -P "$WORLDDB_M4_15_ROOT" | awk 'END { print $1 }')
          case "$device" in
            /dev/*) ;;
            *) printf 'Could not resolve the volume device for %s: %s\n' "$WORLDDB_M4_15_ROOT" "$device" >&2; exit 1 ;;
          esac
          diskutil info "$device" > "$WORLDDB_M4_15_ROOT/diskutil-info.txt"
          filesystem=$(awk -F: '/^[[:space:]]*File System Personality:/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' "$WORLDDB_M4_15_ROOT/diskutil-info.txt")
          if [ "$filesystem" != APFS ]; then
            printf 'Expected APFS at %s; diskutil reported: %s\n' "$WORLDDB_M4_15_ROOT" "${filesystem:-unavailable}" >&2
            cat "$WORLDDB_M4_15_ROOT/diskutil-info.txt" >&2
            exit 1
          fi
          printf 'filesystem=%s\n' "$filesystem" > "$WORLDDB_M4_15_ROOT/metadata.txt"
          printf 'source_revision=%s\n' "$(git rev-parse HEAD)" >> "$WORLDDB_M4_15_ROOT/metadata.txt"
          sw_vers >> "$WORLDDB_M4_15_ROOT/metadata.txt"
          printf 'hardware_model=%s\n' "$(sysctl -n hw.model)" >> "$WORLDDB_M4_15_ROOT/metadata.txt"

      - name: Build APFS sync probe
        env:
          WORLDDB_M4_15_ROOT: ${{ runner.temp }}/worlddb/m4-15-evidence
        run: clang -std=c11 -Wall -Wextra -Werror -O2 tools/m4-15/macos_sync_probe.c -o "$WORLDDB_M4_15_ROOT/macos_sync_probe"

      - name: Measure fsync and F_FULLFSYNC
        env:
          WORLDDB_M4_15_ROOT: ${{ runner.temp }}/worlddb/m4-15-evidence
        run: |
          "$WORLDDB_M4_15_ROOT/macos_sync_probe" "$WORLDDB_M4_15_ROOT" 1000 \
            > "$WORLDDB_M4_15_ROOT/samples.csv" \
            2> "$WORLDDB_M4_15_ROOT/probe.stderr.log"

      - name: Summarize measurements and verify error controls
        env:
          WORLDDB_M4_15_ROOT: ${{ runner.temp }}/worlddb/m4-15-evidence
        run: |
          python3 -B -X utf8 tools/m4-15/summarize_sync_probe.py \
            "$WORLDDB_M4_15_ROOT/samples.csv" \
            > "$WORLDDB_M4_15_ROOT/summary.json"

      - name: Test storage backend sync, directory, and injected failure behavior
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/worlddb/m4-15-target
          WORLDDB_M4_15_ROOT: ${{ runner.temp }}/worlddb/m4-15-evidence
        run: |
          set -euo pipefail
          cargo test --locked --package worlddb-storage-file --lib 2>&1 \
            | tee "$WORLDDB_M4_15_ROOT/storage-library-tests.log"

      - name: Test native writer-lock contract on APFS
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/worlddb/m4-15-target
          WORLDDB_M4_15_ROOT: ${{ runner.temp }}/worlddb/m4-15-evidence
        run: |
          set -euo pipefail
          cargo test --locked --package worlddb-storage-file --test m5_02_contract 2>&1 \
            | tee "$WORLDDB_M4_15_ROOT/storage-writer-lock-tests.log"

      - name: Archive APFS measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-15-apfs-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worlddb/m4-15-evidence/
          if-no-files-found: warn
          retention-days: 30
